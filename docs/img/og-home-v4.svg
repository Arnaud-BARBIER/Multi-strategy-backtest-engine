<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Créer, modéliser et améliorer vos stratégies</title>
  <desc id="desc">Aperçu du framework de recherche Python d'Arnaud Barbier, sur fond sombre avec des accents ambre.</desc>
  <defs>
    <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F0A93A"/>
      <stop offset=".34" stop-color="#78520E"/>
      <stop offset="1" stop-color="#0e1117"/>
    </linearGradient>
    <radialGradient id="warm-glow" cx="100%" cy="0%" r="85%">
      <stop offset="0" stop-color="#7a4b16" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0e1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0e1117"/>
  <rect width="1200" height="630" fill="url(#warm-glow)"/>

  <rect x="72" y="57" width="3" height="48" fill="#F0A93A"/>
  <text x="95" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.1">ARNAUD BARBIER</text>
  <text x="95" y="102" fill="#F0A93A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2">FRAMEWORK DE RECHERCHE PYTHON</text>

  <rect x="72" y="137" width="1056" height="2" fill="url(#rule)"/>

  <text x="72" y="245" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700" letter-spacing="-.7">Créer, modéliser et</text>
  <text x="72" y="309" fill="#F0A93A" font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700" letter-spacing="-.7">améliorer vos stratégies</text>
  <text x="74" y="379" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Toute votre attention est dédiée à votre stratégie,</text>
  <text x="74" y="410" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">pas à ce qui la teste.</text>
  <text x="74" y="492" fill="#F0A93A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.7">UN NOYAU COMPILÉ · QUATRE MODES</text>

  <rect x="774" y="174" width="354" height="344" rx="3" fill="#12171f" stroke="#3b2d18" stroke-width="1.5"/>
  <rect x="774" y="174" width="4" height="344" fill="#F0A93A"/>
  <text x="804" y="211" fill="#F0A93A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">ENVIRONNEMENT SIMPLE D'UTILISATION</text>

  <circle cx="807" cy="254" r="4" fill="#F0A93A"/>
  <text x="824" y="261" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Moins d'1 minute</text>
  <text x="824" y="287" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14">pour configurer un backtest complexe</text>

  <rect x="804" y="310" width="294" height="1" fill="#3b2d18"/>
  <circle cx="807" cy="346" r="4" fill="#F0A93A"/>
  <text x="824" y="353" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Moins d'une seconde</text>
  <text x="824" y="379" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14">pour un run dense et réaliste</text>

  <rect x="804" y="402" width="294" height="1" fill="#3b2d18"/>
  <text x="804" y="438" fill="#F0A93A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">ANALYSE DES RÉSULTATS</text>
  <text x="804" y="468" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Tests de validation intégrés</text>

  <rect x="72" y="558" width="1056" height="2" fill="url(#rule)"/>
  <text x="72" y="591" fill="#a8adb6" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.2">CRÉER · MODÉLISER · AMÉLIORER</text>
  <text x="1128" y="591" fill="#a8adb6" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.2">BACKTEST · PORTFEUILLE · VALIDATION</text>
</svg>
